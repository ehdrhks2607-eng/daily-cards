name: check-tokens

# Push a change to .github/check_tokens_request (or run manually) to verify all tokens.
# Result is committed to token_check.json (usernames only, never token values).
on:
  push:
    paths:
      - ".github/check_tokens_request"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          JAK_THREADS_TOKEN: ${{ secrets.JAK_THREADS_TOKEN }}
          JAK_IG_TOKEN: ${{ secrets.JAK_IG_TOKEN }}
          SEOUL_THREADS_TOKEN: ${{ secrets.SEOUL_THREADS_TOKEN }}
          SEOUL_IG_TOKEN: ${{ secrets.SEOUL_IG_TOKEN }}
        run: python scripts/check_tokens.py
      - name: Save result
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add token_check.json
          git diff --cached --quiet || (git commit -m "token check" && git pull --rebase && git push)
