name: publish

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish due posts
        env:
          JAK_THREADS_TOKEN: ${{ secrets.JAK_THREADS_TOKEN }}
          JAK_IG_TOKEN: ${{ secrets.JAK_IG_TOKEN }}
          SEOUL_THREADS_TOKEN: ${{ secrets.SEOUL_THREADS_TOKEN }}
          SEOUL_IG_TOKEN: ${{ secrets.SEOUL_IG_TOKEN }}
        run: python scripts/publish.py
      - name: Save results
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "publish results" && git pull --rebase && git push)
