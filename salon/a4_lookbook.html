<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매장 사용 설명서 룩북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
/* ── 룩북 디자인 토큰 ──
   스튜디오 그레이 = 디자이너 프로필 사진 배경 / 애쉬 모브 = 포인트 컬러 하나 */
:root {
  --studio:#E9E8E6; --paper:#FFFFFF; --ink:#1E1C1A; --graphite:#6F6B67;
  --mauve:#8B6C84; --mist:#EEE6EC; --hair:#CFCBC7;
  --display:"Anton", "Black Han Sans", sans-serif;
  --title:"Black Han Sans", "Pretendard", sans-serif;
  --body:"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", "Pretendard", monospace;
}
@page { size:A4 portrait; margin:0; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body { background:#BDBAB6; color:var(--ink); font-family:var(--body); padding:30px 0 90px; }

/* A4 한 장: 왼쪽 책등(섹션 이름) + 본문 */
.page { width:210mm; height:297mm; margin:0 auto 30px; background:var(--studio); position:relative; overflow:hidden;
  display:grid; grid-template-columns:150px 1fr; box-shadow:0 6px 24px rgba(0,0,0,.18); }
.spine { position:relative; overflow:hidden; }
.spine b { position:absolute; left:138px; bottom:44px; transform-origin:left bottom; transform:rotate(-90deg);
  font-family:var(--display); font-weight:400; font-size:184px; line-height:.86; letter-spacing:1px; color:var(--mauve); white-space:nowrap; }
.main { padding:58px 48px 0 34px; display:flex; flex-direction:column; min-width:0; position:relative; }
.eyebrow { font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:2px; color:var(--mauve); text-transform:uppercase; }
.title { font-family:var(--title); font-weight:400; font-size:50px; line-height:1.12; margin:8px 0 26px; letter-spacing:-.5px; word-break:keep-all; }
.body { flex:1; min-height:0; display:flex; flex-direction:column; }
.index { display:flex; flex-wrap:wrap; gap:4px 12px; padding:16px 0 26px; margin-top:22px; border-top:1px solid var(--hair);
  font-family:var(--mono); font-size:10.5px; color:var(--graphite); }
.index span.on { color:var(--mauve); font-weight:600; }
.index .pg { margin-left:auto; color:var(--ink); font-weight:600; }

/* 공통 */
.rule { border-top:1px solid var(--hair); }
.label { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:1.5px; color:var(--mauve); text-transform:uppercase; }
.ph { background:var(--paper) center 12% / cover no-repeat; position:relative; overflow:hidden; border-radius:10px; }
.ph.zoom { background-size:150%; background-position:50% 3%; }
.ph.empty { display:flex; align-items:center; justify-content:center; color:var(--hair); }
.ph.empty svg { width:46%; height:60%; }
.mbti { display:inline-block; font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:1px; color:var(--mauve);
  border:1.5px solid var(--mauve); border-radius:999px; padding:1px 9px; white-space:nowrap; }
.mbti.long { font-size:10px; letter-spacing:0; }

/* 1. 표지 */
.cover .main { padding-top:64px; }
.cover .brand { font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:3px; color:var(--ink); text-transform:uppercase; white-space:pre-line; line-height:1.6; }
.cover .hello { margin-top:120px; font-size:22px; font-weight:600; line-height:1.5; color:var(--graphite); white-space:pre-line; }
.cover .big { font-family:var(--title); font-size:86px; line-height:1.04; margin-top:14px; white-space:pre-line; word-break:keep-all; letter-spacing:-1px; }
.cover .since { margin-top:22px; font-family:var(--mono); font-size:14px; color:var(--mauve); font-weight:600; letter-spacing:2px; }
.faces { margin-top:auto; }
.faces .label { margin-bottom:12px; }
.faces .row { display:flex; gap:10px; }
.faces .row div { flex:1; text-align:center; font-size:12.5px; font-weight:700; }
.faces .ph { aspect-ratio:1; border-radius:50%; margin-bottom:6px; border:2px solid var(--paper); }

/* 2. 매장 정보 */
.facts { display:flex; flex-direction:column; }
.facts .row { display:grid; grid-template-columns:118px 1fr; gap:14px; padding:17px 0; border-top:1px solid var(--hair); align-items:baseline; }
.facts .row:last-child { border-bottom:1px solid var(--hair); }
.facts .v { font-size:22px; font-weight:600; line-height:1.4; white-space:pre-line; word-break:keep-all; }
.wifi { margin-top:auto; background:var(--paper); border-radius:14px; padding:22px 24px; display:grid; grid-template-columns:auto 1fr; gap:6px 20px; align-items:baseline; }
.wifi .v { font-family:var(--mono); font-size:24px; font-weight:600; white-space:pre-line; line-height:1.5; }

/* 3. 디자이너 */
.lead { display:grid; grid-template-columns:200px 1fr; gap:24px; align-items:end; padding-bottom:22px; border-bottom:1px solid var(--hair); margin-bottom:20px; position:relative; }
.lead .ph { height:240px; }
.lead .nm { font-family:var(--title); font-size:64px; line-height:1; margin:8px 0 14px; }
.crew { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px 16px; }
.crew .c { position:relative; }
.crew .ph { aspect-ratio:1; }
.crew .nm { font-size:21px; font-weight:800; margin-top:9px; }
.crew .rl { font-size:12.5px; color:var(--graphite); font-weight:600; margin-left:6px; }
.crew .mbti { margin-top:6px; }

/* 4. 파트너 */
.pgrid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:1fr; gap:24px 16px; }
.pgrid .c { display:flex; flex-direction:column; min-height:0; }
.pgrid .c { position:relative; }
.pgrid .ph { flex:1; min-height:0; }
.pgrid .nm { font-size:19px; font-weight:800; margin-top:9px; }
.pgrid .nt { font-family:var(--mono); font-size:11.5px; color:var(--graphite); margin-top:2px; }

/* 5. 첫날 */
.trio { display:flex; flex-direction:column; gap:0; margin-bottom:34px; }
.trio .row { display:grid; grid-template-columns:96px 1fr; gap:14px; padding:14px 0; border-top:1px solid var(--hair); align-items:baseline; }
.trio .row:last-child { border-bottom:1px solid var(--hair); }
.trio .v { font-size:19px; font-weight:600; line-height:1.45; white-space:pre-line; }
.flow { flex:1; display:flex; flex-direction:column; justify-content:space-between; padding:6px 0 4px; }
.flow .f { display:grid; grid-template-columns:150px 1fr; gap:14px; align-items:baseline; }
.flow .t { font-family:var(--display); font-size:34px; color:var(--mauve); line-height:1; }
.flow .d { font-size:19px; font-weight:600; line-height:1.35; }
.flow .t.sm { font-family:var(--title); font-size:20px; line-height:1.2; }
.flow .d.full { display:none; }
.editing .flow .d.full { display:block; }
.editing .flow .d.show { display:none; }

/* 6. 1주일 */
.note { background:var(--mist); border-radius:12px; padding:16px 20px; font-size:15.5px; line-height:1.6; white-space:pre-line; margin-bottom:12px; }
.days { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
.days .d { display:grid; grid-template-columns:96px 1fr; gap:12px; padding:13px 0; border-top:1px solid var(--hair); position:relative; }
.days .n { font-family:var(--display); font-size:30px; line-height:1; color:var(--mauve); }
.days .n small { display:block; font-family:var(--mono); font-size:10px; color:var(--graphite); letter-spacing:2px; margin-bottom:3px; }
.days .what { font-size:15px; color:var(--graphite); line-height:1.55; white-space:pre-line; }
.days .what::first-line { font-size:18px; font-weight:800; color:var(--ink); }
.days .mission { font-size:15px; color:var(--graphite); margin-top:4px; line-height:1.4; }

/* 7. 말 사전 */
.keys { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:10px 0 12px; }
.keys div { background:var(--paper); border-radius:12px; padding:14px 4px 12px; text-align:center; }
.keys b { display:block; font-family:var(--display); font-weight:400; font-size:44px; line-height:1; color:var(--ink); }
.keys span { display:block; margin-top:8px; font-size:15px; font-weight:700; color:var(--mauve); }
.keynote { font-size:14px; color:var(--graphite); margin-bottom:26px; }
.dict { flex:1; display:flex; flex-direction:column; justify-content:space-between; margin-top:8px; }
.dict div { display:grid; grid-template-columns:150px 1fr; gap:14px; padding:10px 0; border-top:1px solid var(--hair); align-items:baseline; }
.dict b { font-size:16.5px; font-weight:800; }
.dict span { font-size:15.5px; color:var(--graphite); line-height:1.4; word-break:keep-all; }

/* 8. 멘트 */
.scripts { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:12px; }
.sc { background:var(--paper); border-radius:12px; padding:14px 16px 12px; display:flex; flex-direction:column; gap:7px; min-height:0; }
.sc .label { margin-bottom:2px; }
.sc .q { position:relative; padding-left:16px; font-size:14px; line-height:1.42; white-space:pre-line; word-break:keep-all; }
.sc .q::before { content:"“"; position:absolute; left:0; top:-4px; font-family:var(--display); font-size:22px; color:var(--mauve); }
.tipline { margin-top:14px; display:flex; gap:12px; align-items:baseline; font-size:16px; font-weight:700; }

/* 9. 에티켓 */
.rules { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
.rules li { list-style:none; display:grid; grid-template-columns:22px 1fr; gap:14px; align-items:center; padding:20px 0; border-top:1px solid var(--hair); position:relative; }
.rules li:last-child { border-bottom:1px solid var(--hair); }
.rules li i { width:12px; height:12px; background:var(--mauve); border-radius:3px; transform:rotate(45deg); }
.rules li .t { font-size:25px; font-weight:700; line-height:1.35; word-break:keep-all; }

/* 편집 모드 */
.editing [data-path] { outline:2px dashed var(--mauve); outline-offset:3px; border-radius:3px; cursor:text; min-width:24px; min-height:1em; }
.editing [data-path]:focus { outline-style:solid; background:rgba(255,255,255,.6); }
.editing .ph { cursor:pointer; outline:3px dashed var(--mauve); outline-offset:-6px; }
.editing .ph::after { content:"📷 사진 바꾸기"; position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  background:rgba(0,0,0,.6); color:#fff; font-size:13px; padding:3px 10px; border-radius:999px; white-space:nowrap; }
.del, .add, .mv { display:none; }
.editing .del, .editing .mv { display:flex; position:absolute; top:-8px; width:26px; height:26px; border-radius:50%;
  border:1.5px solid var(--ink); font-weight:900; align-items:center; justify-content:center; cursor:pointer; z-index:3; font-size:14px; }
.editing .del { right:-8px; background:#d9534f; color:#fff; }
.editing .mv { left:-8px; background:var(--paper); color:var(--ink); }
.editing .add { display:block; margin-top:12px; align-self:flex-start; border:1.5px dashed var(--mauve); background:transparent;
  color:var(--mauve); font:700 15px var(--body); border-radius:8px; padding:4px 12px; cursor:pointer; }

#bar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:50; display:flex; gap:6px; align-items:center;
  background:rgba(30,28,26,.9); padding:9px 11px; border-radius:14px; font:500 14px var(--body); }
#bar button { font:inherit; border:0; border-radius:8px; padding:6px 12px; cursor:pointer; background:#fff; color:#222; }
#bar button:focus-visible { outline:3px solid var(--mauve); outline-offset:2px; }
#bar .on { background:#E7D3E2; }
#hint { position:fixed; left:50%; top:10px; transform:translateX(-50%); z-index:50; display:none; background:#E7D3E2; color:#222;
  padding:7px 16px; border-radius:999px; font:700 14px var(--body); }
body.edit-on #hint { display:block; }

@media print {
  body { background:none; padding:0; }
  .page { margin:0; box-shadow:none; break-after:page; }
  #bar, #hint, .add, .del, .mv { display:none !important; }
  .editing [data-path], .editing .ph { outline:none !important; }
  .editing .ph::after { display:none; }
}

/* ── 표지: 잡지 커버 ── */
.mag { display:block; background:#DAD8D6; }
.mag .top { position:absolute; left:40px; right:40px; top:22px; display:flex; justify-content:space-between; z-index:4;
  font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:2px; text-transform:uppercase; }
.mag .masthead { position:absolute; left:0; right:0; top:62px; text-align:center; z-index:1; font-family:var(--display);
  font-size:232px; line-height:.8; letter-spacing:-3px; color:var(--ink); }
.mag .sub { position:absolute; right:44px; top:252px; z-index:4; font-family:var(--mono); font-size:13px; font-weight:600;
  letter-spacing:4px; color:var(--mauve); }
.mag .photo { position:absolute; left:0; right:0; top:276px; bottom:0; z-index:2; border-radius:0; background-color:transparent;
  background-size:auto 100%; background-position:100% 0; background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(to right, transparent 18%, #000 40%, #000 92%, transparent 100%);
          mask-image:linear-gradient(to right, transparent 18%, #000 40%, #000 92%, transparent 100%); }
.mag .left { position:absolute; left:40px; top:300px; width:330px; z-index:3; }
.mag .kicker { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:3px; color:var(--mauve); }
.mag .headline { font-family:var(--title); font-size:62px; line-height:1.02; margin:6px 0 30px; white-space:pre-line; letter-spacing:-1px; }
.mag .cl { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; margin-bottom:22px; }
.mag .cl .n { font-family:var(--display); font-size:62px; line-height:.9; color:var(--mauve); min-width:56px; }
.mag .cl .t { font-size:18px; font-weight:800; line-height:1.3; white-space:pre-line; }
.mag .badge { position:absolute; right:52px; top:318px; z-index:3; width:132px; height:132px; border-radius:50%; background:var(--mauve);
  color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--title); font-size:22px;
  line-height:1.15; white-space:pre-line; transform:rotate(8deg); }
.mag .signals { position:absolute; left:40px; bottom:150px; z-index:3; font-size:17px; font-weight:800; line-height:1.4; white-space:pre-line;
  background:var(--ink); color:#fff; padding:10px 14px; border-radius:4px; }
.mag .hello { position:absolute; left:40px; bottom:52px; z-index:3; font-size:19px; font-weight:700; white-space:pre-line; line-height:1.45; }
.mag .cap { position:absolute; right:58px; top:468px; z-index:3; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:2px;
  color:var(--ink); text-transform:uppercase; }
</style>
</head>
<body>
<div id="hint">편집 중 · 글자를 눌러 고치고, 사진 칸을 눌러 사진을 넣으세요 (자동 저장)</div>
<div id="pages"></div>
<div id="bar">
  <button id="btnEdit">✏️ 편집</button>
  <button id="btnPrint">🖨️ 인쇄 · PDF 저장</button>
  <button id="btnExport">백업 저장</button>
  <button id="btnImport">백업 불러오기</button>
  <button id="btnReset">처음으로</button>
</div>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json" hidden>

      { when:"시술 준비", lines:["커트 준비해 드리겠습니다", "염색·클리닉 준비해 드리겠습니다", "약제 도포해 드리겠습니다\n살짝 차가우세요~"] },
      { when:"샴푸 · 시술 중", lines:["물 온도, 압 세기 괜찮으세요?", "열처리 진행할 건데 뜨겁거나\n불편하시면 바로 말씀해 주세요", "살짝 당기실 수 있는데\n아프시면 말씀해 주세요"] },
      { when:"퇴점 · 배웅할 때", lines:["고생하셨습니다~\n데스크로 안내해 드리겠습니다", "혹시 차량 가져오셨을까요?", "감사합니다. 조심히 들어가세요\n다음에 또 뵙겠습니다."] },
      { when:"전화 응대", lines:["행복을 드리는 아이디헤어입니다\n무엇을 도와드릴까요?", "원하시는 날짜와 시간대가\n어떻게 되실까요?", "O월 O일 O시 OO 선생님께\nOO 예약해 드리겠습니다"] }
    ]
  }
};

const KEY = "salon-welcome-board-v3";
let data = fillMbti(load());
let editing = false;

function load(){
  let d = structuredClone(DEFAULT);
  try { const s = localStorage.getItem(KEY); if (s) d = Object.assign(d, JSON.parse(s)); } catch(e){}
  return d;
}
function fillMbti(d){
  (d.designers || []).forEach(x => {
    if (!x.mbti || x.mbti === "MBTI"){ const k = DEFAULT.designers.find(y => y.name === x.name); if (k) x.mbti = k.mbti; }
  });
  return d;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ alert("저장 공간이 부족해요. 사진 수를 줄이거나 [백업 저장]을 해 두세요."); }
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const ed = (path, val, cls="", tag="div") => `<${tag} class="${cls}" data-path="${path}">${esc(val)}</${tag}>`;
function getP(path){ return path.split(".").reduce((o,k)=>o?.[k], data); }
function setP(path, v){ const ks = path.split("."); const last = ks.pop(); ks.reduce((o,k)=>o[k], data)[last] = v; }

const SILHOUETTE = `<svg viewBox="0 0 100 120"><circle cx="50" cy="40" r="24" fill="currentColor"/><path d="M8 120c4-30 22-44 42-44s38 14 42 44z" fill="currentColor"/></svg>`;
const INDEX = ["표지", "매장 정보", "디자이너", "파트너", "첫날", "1주일", "말 사전", "멘트", "에티켓"];

function photo(path, cls=""){
  const src = getP(path);
  return src ? `<div class="ph ${cls}" data-photo="${path}" style="background-image:url('${src}')"></div>`
             : `<div class="ph empty" data-photo="${path}">${SILHOUETTE}</div>`;
}
const mbti = (path, v) => ed(path, v ?? "MBTI", "mbti" + ((v||"").length > 11 ? " long" : ""), "span");
const tools = (key, i) => `<button class="mv" data-mv="${key}.${i}" title="앞으로">◀</button><button class="del" data-del="${key}.${i}">×</button>`;

function page(n, spine, eyebrow, title, inner, cls=""){
  return `<section class="page ${cls}">
    <div class="spine" aria-hidden="true"><b>${spine}</b></div>
    <div class="main">
      ${eyebrow ? `<div class="eyebrow">${String(n).padStart(2,"0")} · ${eyebrow}</div>` : ""}
      ${title ? `<h2 class="title">${title}</h2>` : ""}
      <div class="body">${inner}</div>
      <div class="index">${INDEX.map((t,i)=>`<span class="${i===n-1?"on":""}">${t}</span>`).join("")}<span class="pg">${String(n).padStart(2,"0")} / ${String(INDEX.length).padStart(2,"0")}</span></div>
    </div>
  </section>`;
}

function render(){
  const s = data.store, P = [];
  const [lead, ...crew] = data.designers;

  const cv = data.cover;
  P.push(`<section class="page mag">
    <div class="top"><span>${esc(cv.issue)}</span><span>${esc(s.open)} · ${esc(s.name.replace(/^.*아이디헤어\s*/, "") || s.name)}</span></div>
    <div class="masthead" aria-label="Maison de idHAIR">MAISON</div>
    <div class="sub">de idHAIR</div>
    <div class="ph photo" data-photo="cover.photo" style="background-image:url('${cv.photo}')"></div>
    <div class="left">
      ${ed("cover.kicker", cv.kicker, "kicker")}
      ${ed("cover.headline", cv.headline, "headline")}
      ${cv.lines.map((l,i)=>`<div class="cl">${ed(`cover.lines.${i}.num`, l.num, "n", "span")}${ed(`cover.lines.${i}.text`, l.text, "t", "span")}</div>`).join("")}
    </div>
    ${ed("cover.badge", cv.badge, "badge")}
    ${ed("cover.signals", cv.signals, "signals")}
    ${ed("store.hello", s.hello, "hello")}
    ${ed("cover.caption", cv.caption, "cap")}
  </section>`);

  P.push(page(2, "SALON", "Our salon", "우리 매장 정보", `
    <div class="facts">
      ${[["Since","open"],["주소","addr"],["매장 번호","tel"],["대표","owner"],["영업시간","hours"],["휴무","off"]]
        .map(([k,f])=>`<div class="row"><span class="label">${k}</span>${ed("store."+f, s[f], "v")}</div>`).join("")}
    </div>
    <div class="wifi"><span class="label">Wi-Fi</span>${ed("store.wifi", s.wifi, "v")}</div>`));

  P.push(page(3, "DESIGNERS", "Designers", "디자이너 가족들", `
    ${lead ? `<div class="lead">
      ${photo("designers.0.photo")}
      <div>
        ${ed("designers.0.role", lead.role, "label", "div")}
        ${ed("designers.0.name", lead.name, "nm")}
        ${mbti("designers.0.mbti", lead.mbti)}
      </div>${tools("designers",0)}
    </div>` : ""}
    <div class="crew">${crew.map((d,k)=>{ const i=k+1; return `
      <div class="c">
        ${photo(`designers.${i}.photo`, "zoom")}
        <div>${ed(`designers.${i}.name`, d.name, "nm", "span")}${ed(`designers.${i}.role`, d.role, "rl", "span")}</div>
        ${mbti(`designers.${i}.mbti`, d.mbti)}
        ${tools("designers",i)}
      </div>`; }).join("")}
    </div>
    <button class="add" data-add="designers">+ 디자이너 추가</button>`));

  P.push(page(4, "PARTNERS", "Partners", "파트너 가족들", `
    <div class="pgrid">${data.partners.map((p,i)=>`
      <div class="c">
        ${photo(`partners.${i}.photo`)}
        ${ed(`partners.${i}.name`, p.name, "nm")}
        ${ed(`partners.${i}.note`, p.note, "nt")}
        ${tools("partners",i)}
      </div>`).join("")}
    </div>
    <button class="add" data-add="partners">+ 파트너 추가</button>`));

  const f = data.firstday;
  P.push(page(5, "DAY ONE", "Day one", "파트너 첫날 안내", `
    <div class="trio">
      ${[["출근","time"],["복장","dress"],["준비물","bring"]].map(([k,x])=>`<div class="row"><span class="label">${k}</span>${ed("firstday."+x, f[x], "v")}</div>`).join("")}
    </div>
    <div class="label" style="margin-bottom:14px">첫날 하루 흐름</div>
    <div class="flow">${f.flow.map((t,i)=>{ const parts = t.split(/\s{2,}/), lab = parts.length > 1 ? parts[0] : "", desc = parts.length > 1 ? parts.slice(1).join(" ") : t; return `
      <div class="f"><span class="t${lab.length > 6 ? " sm" : ""}">${esc(lab)}</span><span class="d show">${esc(desc)}</span>${ed(`firstday.flow.${i}`, t, "d full")}</div>`; }).join("")}
    </div>`));

  P.push(page(6, "WEEK ONE", "First week · OJT", "두근두근 1주일 OJT", `
    ${ed("todoNote", data.todoNote, "note")}
    <div class="days">${data.todo.map((t,i)=>{ const [a,b=""] = t.split("\n"); return `
      <div class="d">
        <div class="n"><small>DAY</small>${i+1}</div>
        <div>${ed(`todo.${i}`, t, "what")}</div>
      </div>`; }).join("")}
    </div>
    <button class="add" data-add="todo">+ 줄 추가</button>`));

  const g = data.glossary;
  P.push(page(7, "WORDS", "Words we use", "우리 매장 말 사전", `
    <div class="label">매장 신호</div>
    <div class="keys">${g.signals.map((x,i)=>`<div>${ed(`glossary.signals.${i}.0`, x[0], "", "b")}${ed(`glossary.signals.${i}.1`, x[1], "", "span")}</div>`).join("")}</div>
    ${ed("glossary.signalNote", g.signalNote, "keynote")}
    <div class="label">자주 쓰는 말</div>
    <div class="dict">${g.terms.map((x,i)=>`<div>${ed(`glossary.terms.${i}.0`, x[0], "", "b")}${ed(`glossary.terms.${i}.1`, x[1], "", "span")}</div>`).join("")}</div>`));

  const tk = data.talk;
  P.push(page(8, "SCRIPT", "Scripts", esc(tk.title), `
    <div class="scripts">${tk.parts.map((p,i)=>`
      <div class="sc">
        ${ed(`talk.parts.${i}.when`, p.when, "label")}
        ${p.lines.map((l,j)=>ed(`talk.parts.${i}.lines.${j}`, l, "q")).join("")}
      </div>`).join("")}
    </div>
    <div class="tipline"><span class="label">Tip</span>${ed("talk.tip", tk.tip)}</div>`));

  P.push(page(9, "MANNERS", "Manners", "기본 에티켓 지켜요!", `
    <ul class="rules">${data.etiquette.map((t,i)=>`<li><i></i>${ed(`etiquette.${i}`, t, "t")}<button class="del" data-del="etiquette.${i}">×</button></li>`).join("")}</ul>
    <button class="add" data-add="etiquette">+ 줄 추가</button>`));

  document.getElementById("pages").innerHTML = P.join("");
  applyEdit();
}

function applyEdit(){
  document.body.classList.toggle("edit-on", editing);
  const root = document.getElementById("pages");
  root.classList.toggle("editing", editing);
  root.querySelectorAll("[data-path]").forEach(el => el.contentEditable = editing ? "plaintext-only" : "false");
  const b = document.getElementById("btnEdit");
  b.textContent = editing ? "✅ 편집 끝" : "✏️ 편집"; b.classList.toggle("on", editing);
}

const root = document.getElementById("pages");
root.addEventListener("input", e => {
  const el = e.target.closest("[data-path]"); if (!el) return;
  setP(el.dataset.path, el.innerText.replace(/\n+$/,"")); save();
  if (el.dataset.path === "store.name") document.querySelectorAll("[data-store-name]").forEach(f => f.textContent = data.store.name + " · 매장 사용 설명서");
});

let photoTarget = null;
root.addEventListener("click", e => {
  if (!editing) return;
  const ph = e.target.closest("[data-photo]"), del = e.target.closest("[data-del]"),
        add = e.target.closest("[data-add]"), mv = e.target.closest("[data-mv]");
  if (del){
    const [key, idx] = splitLast(del.dataset.del);
    if (!confirm("이 항목을 지울까요?")) return;
    getP(key).splice(+idx, 1); save(); render();
  } else if (add){
    const key = add.dataset.add;
    const blank = key==="designers" ? { photo:"", role:"디자이너", name:"이름", mbti:"MBTI", intro:"", tags:"", insta:"" }
                : key==="partners" ? { photo:"", name:"이름", note:"합류 날짜" } : "새 줄";
    getP(key).push(blank); save(); render();
  } else if (mv){
    const [key, idx] = splitLast(mv.dataset.mv); const a = getP(key), i = +idx;
    if (i>0){ [a[i-1], a[i]] = [a[i], a[i-1]]; save(); render(); }
  } else if (ph){
    photoTarget = ph.dataset.photo; document.getElementById("filePhoto").click();
  }
});
function splitLast(p){ const i = p.lastIndexOf("."); return [p.slice(0,i), p.slice(i+1)]; }

/* A4 인쇄용이라 사진은 조금 더 크게(긴 변 900px) 저장 */
document.getElementById("filePhoto").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !photoTarget) return;
  const img = new Image();
  img.onload = () => {
    const max = 900, r = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    setP(photoTarget, c.toDataURL("image/jpeg", 0.85)); save(); render(); URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
});

document.getElementById("btnEdit").onclick = () => { editing = !editing; applyEdit(); };
document.getElementById("btnPrint").onclick = () => { editing = false; applyEdit(); setTimeout(() => print(), 50); };
document.getElementById("btnReset").onclick = () => {
  if (confirm("사진과 고친 내용을 모두 지우고 처음 상태로 돌릴까요? (먼저 [백업 저장]을 권해요)")){
    data = structuredClone(DEFAULT); save(); render();
  }
};
document.getElementById("btnExport").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type:"application/json" }));
  a.download = "매장안내판_백업.json"; a.click();
};
document.getElementById("btnImport").onclick = () => document.getElementById("fileJson").click();
document.getElementById("fileJson").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { data = Object.assign(structuredClone(DEFAULT), JSON.parse(await f.text())); save(); render(); }
  catch(err){ alert("백업 파일을 읽지 못했어요."); }
});

render();
</script>
