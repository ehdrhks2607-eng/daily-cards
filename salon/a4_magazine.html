<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAISON 매거진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
/* ── MAISON 매거진: 스튜디오 그레이 × 애쉬 모브 ── */
:root {
  --studio:#E9E8E6; --paper:#FFFFFF; --ink:#1E1C1A; --graphite:#6F6B67;
  --mauve:#8B6C84; --mist:#EEE6EC; --hair:#CFCBC7;
  --display:"Anton", "Black Han Sans", sans-serif;
  --title:"Black Han Sans", "Pretendard", sans-serif;
  --body:"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", "Pretendard", monospace;
}
@page { size:A4 portrait; margin:0; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
body { background:#BDBAB6; color:var(--ink); font-family:var(--body); padding:30px 0 90px; }
.page { width:210mm; height:297mm; margin:0 auto 30px; background:var(--studio); position:relative; overflow:hidden;
  display:flex; flex-direction:column; padding:0 46px; box-shadow:0 6px 24px rgba(0,0,0,.18); }

/* 잡지 머리말 · 꼬리말 */
.run { display:flex; justify-content:space-between; align-items:baseline; padding:24px 0 10px; border-bottom:1.5px solid var(--ink); }
.run .m { font-family:var(--display); font-size:24px; letter-spacing:.5px; }
.run .m small { font-family:var(--mono); font-size:10px; color:var(--mauve); letter-spacing:2px; margin-left:6px; }
.run .sec { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:3px; color:var(--mauve); }
.folio { display:flex; justify-content:space-between; padding:12px 0 22px; margin-top:auto; border-top:1px solid var(--hair);
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:2px; color:var(--graphite); }
.folio b { color:var(--ink); }

/* 기사 머리 */
.art { flex:1; min-height:0; display:flex; flex-direction:column; padding:26px 0 18px; }
.kicker { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:3px; color:var(--mauve); }
.hl { font-family:var(--title); font-weight:400; font-size:54px; line-height:1.08; letter-spacing:-1px; margin:8px 0 10px; white-space:pre-line; word-break:keep-all; }
.deck { font-size:16px; line-height:1.6; color:var(--graphite); font-weight:500; max-width:560px; margin-bottom:22px; word-break:keep-all; }
.label { font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:2px; color:var(--mauve); text-transform:uppercase; }

.ph { background:var(--paper) center 12% / cover no-repeat; position:relative; overflow:hidden; }
.ph.zoom { background-size:150%; background-position:50% 3%; }
.ph.empty { display:flex; align-items:center; justify-content:center; color:var(--hair); background:var(--paper); }
.ph.empty svg { width:44%; height:58%; }

/* 1. 표지 — 7인 라인업 */
.cover { padding:0; }
.cover .top { display:flex; justify-content:space-between; padding:22px 40px 0; font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:2px; }
.cover .mast { text-align:center; font-family:var(--display); font-size:226px; line-height:.8; letter-spacing:-3px; margin-top:16px; }
.cover .sub { position:absolute; right:44px; top:226px; font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:4px; color:var(--mauve); }
.cover .lines { display:grid; grid-template-columns:1.1fr 1fr 110px; gap:24px; padding:22px 40px 18px; align-items:end; }
.cover .cs .hl { font-size:50px; margin:6px 0 0; }
.cover .cl { display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:center; margin-top:8px; }
.cover .cl .n { font-family:var(--display); font-size:42px; line-height:.95; color:var(--mauve); }
.cover .cl .t { font-size:14.5px; font-weight:800; line-height:1.3; white-space:pre-line; }
.cast { flex:1; min-height:0; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:10px; padding:0 40px; position:relative; }
.cast .s { position:relative; flex:0 0 calc((100% - 30px) / 4); aspect-ratio:3 / 4; border-radius:3px; overflow:hidden; }
.cast .ph { position:absolute; inset:0; background-size:cover; background-position:50% 0; }

.cast .tag { position:absolute; left:0; right:0; bottom:0; padding:34px 6px 10px; text-align:center; color:#fff;
  background:linear-gradient(to top, rgba(20,18,17,.82), transparent); }
.cast .tag b { display:block; font-size:18px; font-weight:800; }
.cast .tag span { display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:1px; opacity:.85; margin-top:2px; }
.cover .badge { position:absolute; right:26px; top:300px; width:112px; height:112px; border-radius:50%; background:var(--mauve); color:#fff; z-index:3;
  display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--title); font-size:19px; line-height:1.15;
  white-space:pre-line; transform:rotate(8deg); box-shadow:0 4px 12px rgba(0,0,0,.18); }
.cover .bottom { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 40px 20px; }
.cover .bottom .hello { font-size:16px; font-weight:800; white-space:pre-line; line-height:1.35; }
.cover .bottom .sig { background:var(--ink); color:#fff; font-size:13px; font-weight:700; padding:8px 12px; border-radius:3px; white-space:pre-line; line-height:1.4; }

/* 2. ABOUT */
.about { display:grid; grid-template-columns:250px 1fr; gap:30px; }
.about .year { font-family:var(--display); font-size:150px; line-height:.82; color:var(--mauve); letter-spacing:-2px; }
.about .yc { font-size:14px; color:var(--graphite); margin-top:10px; font-weight:600; }
.facts .row { display:grid; grid-template-columns:92px 1fr; gap:12px; padding:13px 0; border-top:1px solid var(--hair); align-items:baseline; }
.facts .row:last-child { border-bottom:1px solid var(--hair); }
.facts .v { font-size:18px; font-weight:700; line-height:1.45; white-space:pre-line; word-break:keep-all; }
.pull { margin:44px 0 30px; padding:30px 0; border-top:3px solid var(--ink); border-bottom:1px solid var(--ink); }
.pull q { display:block; font-family:var(--title); font-size:46px; line-height:1.2; quotes:"“" "”"; word-break:keep-all; }
.pull q::before { content:open-quote; color:var(--mauve); }
.pull q::after { content:close-quote; color:var(--mauve); }
.pull .by { margin-top:10px; }
.coupon { margin-top:auto; border:2px dashed var(--ink); border-radius:6px; padding:18px 22px; display:grid; grid-template-columns:1fr auto; gap:6px 16px; align-items:center; position:relative; background:var(--paper); }
.coupon::before { content:"✂"; position:absolute; left:18px; top:-15px; background:var(--studio); padding:0 6px; font-size:20px; }
.coupon .v { font-family:var(--mono); font-size:22px; font-weight:600; white-space:pre-line; line-height:1.5; }
.coupon .k { font-family:var(--title); font-size:30px; color:var(--mauve); text-align:right; line-height:1.1; white-space:pre-line; }

/* 3. THE CAST */
.leadrow { display:grid; grid-template-columns:230px 1fr; gap:24px; margin-bottom:18px; position:relative; }
.leadrow .ph { height:250px; border-radius:2px; }
.leadrow .nm { font-family:var(--title); font-size:60px; line-height:1; margin:6px 0 4px; }
.leadrow .rl { font-size:15px; font-weight:700; color:var(--graphite); }
.leadrow .big { font-family:var(--display); font-size:64px; color:var(--mauve); line-height:1; margin-top:12px; letter-spacing:1px; }
.stat { margin-top:14px; padding-top:12px; border-top:1px solid var(--hair); display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.stat div { text-align:center; }
.stat b { display:block; font-family:var(--display); font-size:22px; line-height:1.1; }
.stat span { font-family:var(--mono); font-size:9.5px; color:var(--graphite); letter-spacing:1px; }
.castgrid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:1fr; gap:14px; }
.cc { position:relative; display:flex; flex-direction:column; min-height:0; }
.cc .ph { flex:1; min-height:0; border-radius:2px; background-size:150%; background-position:50% 3%; }
.cc .mb { position:absolute; left:8px; bottom:46px; font-family:var(--display); font-size:34px; line-height:1; color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.35); letter-spacing:1px; white-space:nowrap; }
.cc .mb.long { font-size:19px; }
.cc .nm { font-size:18px; font-weight:800; margin-top:8px; }
.cc .rl { font-size:12px; font-weight:600; color:var(--graphite); margin-left:6px; }

/* 4. NEW FACES */
.polas { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:1fr; gap:26px 22px; padding:6px 6px 0; }
.pola { background:var(--paper); padding:10px 10px 0; display:flex; flex-direction:column; min-height:0; box-shadow:0 3px 10px rgba(0,0,0,.1); position:relative; }
.pola:nth-child(odd) { transform:rotate(-1.6deg); } .pola:nth-child(even) { transform:rotate(1.4deg); }
.pola .ph { flex:1; min-height:0; }
.pola .nm { font-family:var(--title); font-size:22px; text-align:center; margin-top:8px; }
.pola .nt { font-family:var(--mono); font-size:10.5px; text-align:center; color:var(--graphite); padding:2px 0 10px; }
.pola::before { content:""; position:absolute; left:50%; top:-10px; width:62px; height:20px; background:rgba(139,108,132,.35); transform:translateX(-50%) rotate(-3deg); }

/* 5. A DAY */
.day { flex:1; min-height:0; display:grid; grid-template-columns:1fr 220px; gap:26px; }
.tl { display:flex; flex-direction:column; justify-content:space-between; border-left:2px solid var(--ink); padding-left:22px; }
.tl .f { position:relative; }
.tl .f::before { content:""; position:absolute; left:-29px; top:12px; width:12px; height:12px; background:var(--mauve); border-radius:50%; }
.tl .t { font-family:var(--display); font-size:44px; line-height:1; }
.tl .t.sm { font-family:var(--title); font-size:24px; line-height:1.3; }
.tl .d { font-size:18px; font-weight:600; margin-top:4px; }
.tl .d.full { display:none; } .editing .tl .d.full { display:block; } .editing .tl .d.show { display:none; }
.side { background:var(--mist); padding:22px 20px; display:flex; flex-direction:column; gap:22px; }
.side .h { font-family:var(--title); font-size:28px; line-height:1; }
.side .v { font-size:16px; font-weight:700; line-height:1.5; white-space:pre-line; margin-top:6px; word-break:keep-all; }

/* 6. CHALLENGE */
.chal { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:14px; }
.ch { background:var(--paper); padding:16px 18px; display:flex; flex-direction:column; position:relative; min-height:0; }
.ch .dn { font-family:var(--display); font-size:44px; line-height:1; color:var(--mauve); }
.ch .dn small { font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--graphite); margin-right:6px; vertical-align:top; }
.ch .what { margin-top:8px; font-size:14.5px; color:var(--graphite); line-height:1.55; white-space:pre-line; word-break:keep-all; }
.ch .what::first-line { font-size:17px; font-weight:800; color:var(--ink); }
.ch .done { position:absolute; right:14px; top:14px; width:30px; height:30px; border:2px solid var(--ink); border-radius:4px; }
.lead-in { background:var(--ink); color:#fff; padding:14px 18px; font-size:14.5px; line-height:1.65; white-space:pre-line; margin-bottom:16px; }

/* 7. DICTIONARY */
.keys { display:grid; grid-template-columns:repeat(5,1fr); border:1.5px solid var(--ink); margin:4px 0 8px; }
.keys div { text-align:center; padding:12px 4px 10px; border-left:1.5px solid var(--ink); }
.keys div:first-child { border-left:0; }
.keys b { display:block; font-family:var(--display); font-weight:400; font-size:40px; line-height:1; }
.keys span { display:block; margin-top:6px; font-size:14px; font-weight:800; color:var(--mauve); }
.keynote { font-size:13px; color:var(--graphite); margin-bottom:18px; }
.dict { flex:1; min-height:0; columns:2; column-gap:30px; column-rule:1px solid var(--hair); }
.dict div { break-inside:avoid; padding:0 0 14px; margin-bottom:14px; border-bottom:1px solid var(--hair); }
.dict b { display:block; font-family:var(--title); font-weight:400; font-size:22px; line-height:1.15; }
.dict span { display:block; font-size:14.5px; color:var(--graphite); line-height:1.5; margin-top:4px; word-break:keep-all; }

/* 8. SCRIPT BOOK */
.hero-q { font-family:var(--title); font-size:36px; line-height:1.2; padding:4px 0 18px; border-bottom:3px solid var(--ink); margin-bottom:16px; white-space:pre-line; }
.hero-q::before { content:"“"; color:var(--mauve); font-family:var(--display); font-size:70px; line-height:0; vertical-align:-24px; margin-right:6px; }
.scripts { flex:1; min-height:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:1fr; gap:12px 26px; }
.sc { display:flex; flex-direction:column; gap:10px; min-height:0; border-top:1px solid var(--ink); padding-top:9px; }
.sc .q { font-size:16.5px; line-height:1.45; white-space:pre-line; word-break:keep-all; padding-left:14px; position:relative; }
.sc .q::before { content:"—"; position:absolute; left:0; color:var(--mauve); }
.sc .q { padding-left:20px; }
.tipline { margin-top:12px; display:flex; gap:12px; align-items:baseline; font-size:15px; font-weight:800; background:var(--mist); padding:10px 14px; }

/* 9. DO & DON'T */
.dd { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:3px solid var(--ink); }
.dd .col { padding:18px 22px 0 0; display:flex; flex-direction:column; }
.dd .col + .col { padding:18px 0 0 22px; border-left:1px solid var(--ink); }
.dd .big { font-family:var(--display); font-size:86px; line-height:.9; }
.dd .col:first-child .big { color:var(--mauve); }
.dd .mk { font-family:var(--title); font-size:22px; margin:4px 0 16px; color:var(--graphite); }
.dd li { list-style:none; font-size:25px; font-weight:800; line-height:1.4; padding:30px 0; border-top:1px solid var(--hair); position:relative; word-break:keep-all; }


/* ── 디자이너 프로필 (THE CAST 인터뷰) ── */
.prof { padding:0; }
.prof .hero { position:absolute; left:0; right:0; top:0; height:650px; background-size:cover; background-position:50% 12%;
  -webkit-mask-image:linear-gradient(to bottom, #000 62%, transparent 100%); mask-image:linear-gradient(to bottom, #000 62%, transparent 100%); }
.prof .run, .prof .folio { position:relative; z-index:2; margin:0 46px; }
.prof .art { position:relative; z-index:2; padding:0 46px; }
.prof .no { position:absolute; left:46px; top:84px; z-index:2; font-family:var(--display); font-size:150px; line-height:.8; color:rgba(139,108,132,.9); }
.prof .no small { display:block; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:3px; color:var(--ink); margin-bottom:8px; }
.prof .quote { position:absolute; right:46px; top:150px; width:170px; z-index:2; text-align:right; }
.prof .quote .a { font-family:var(--title); font-size:42px; line-height:1.08; margin-top:8px; white-space:pre-line; }
.prof .quote .a::before { content:"“"; color:var(--mauve); } .prof .quote .a::after { content:"”"; color:var(--mauve); }
.prof .name { margin-top:430px; display:flex; align-items:flex-end; gap:18px; }
.prof .pnm { font-family:var(--title); font-size:140px; line-height:.86; letter-spacing:-4px; }
.prof .meta { padding-bottom:10px; }
.prof .meta .rl { display:block; font-size:20px; font-weight:800; }
.prof .meta .mb { display:block; font-family:var(--display); font-size:40px; color:var(--mauve); line-height:1; margin-top:4px; letter-spacing:1px; }
.prof .meta .kk { display:block; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:3px; color:var(--graphite); margin-bottom:8px; }
.prof .iv { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; margin-top:18px; padding-top:12px; border-top:3px solid var(--ink); }
.prof .iv .col + .col { border-left:1px solid var(--hair); padding-left:28px; }
.prof .iv h3 { font-family:var(--display); font-weight:400; font-size:22px; letter-spacing:.5px; margin-bottom:6px; }
.prof .qa { padding:8px 0 9px; border-bottom:1px solid var(--hair); }
.prof .qa:last-child { border-bottom:0; }
.prof .qa .q { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--mauve); display:flex; gap:7px; align-items:center; }
.prof .qa .q i { font-style:normal; font-family:var(--body); font-weight:900; color:var(--ink); font-size:13px; }
.prof .qa .a { font-size:16px; font-weight:800; line-height:1.4; margin-top:4px; white-space:pre-line; word-break:keep-all; }

/* 편집 모드 */
.editing [data-path] { outline:2px dashed var(--mauve); outline-offset:3px; border-radius:3px; cursor:text; min-width:24px; min-height:1em; }
.editing [data-path]:focus { outline-style:solid; background:rgba(255,255,255,.6); }
.editing .ph { cursor:pointer; outline:3px dashed var(--mauve); outline-offset:-6px; }
.editing .ph::after { content:"📷 사진 바꾸기"; position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  background:rgba(0,0,0,.6); color:#fff; font-size:12px; padding:3px 9px; border-radius:999px; white-space:nowrap; z-index:2; }
.del, .add, .mv { display:none; }
.editing .del, .editing .mv { display:flex; position:absolute; top:-8px; width:26px; height:26px; border-radius:50%;
  border:1.5px solid var(--ink); font-weight:900; align-items:center; justify-content:center; cursor:pointer; z-index:4; font-size:14px; }
.editing .del { right:-8px; background:#d9534f; color:#fff; }
.editing .mv { left:-8px; background:var(--paper); color:var(--ink); }
.editing .add { display:block; margin-top:10px; align-self:flex-start; border:1.5px dashed var(--mauve); background:transparent;
  color:var(--mauve); font:700 14px var(--body); border-radius:8px; padding:3px 12px; cursor:pointer; }

#bar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:50; display:flex; gap:6px; align-items:center;
  background:rgba(30,28,26,.9); padding:9px 11px; border-radius:14px; font:500 14px var(--body); }
#bar button { font:inherit; border:0; border-radius:8px; padding:6px 12px; cursor:pointer; background:#fff; color:#222; }
#bar button:focus-visible { outline:3px solid var(--mauve); outline-offset:2px; }
#bar .on { background:#E7D3E2; }
#hint { position:fixed; left:50%; top:10px; transform:translateX(-50%); z-index:50; display:none; background:#E7D3E2; color:#222;
  padding:7px 16px; border-radius:999px; font:700 14px var(--body); }
body.edit-on #hint { display:block; }
@media print {
  body { background:none; padding:0; }
  .page { margin:0; box-shadow:none; break-after:page; }
  #bar, #hint, .add, .del, .mv { display:none !important; }
  .editing [data-path], .editing .ph { outline:none !important; }
  .editing .ph::after { display:none; }
}
</style>
</head>
<body>
<div id="hint">편집 중 · 글자를 눌러 고치고, 사진 칸을 눌러 사진을 넣으세요 (자동 저장)</div>
<div id="pages"></div>
<div id="bar">
  <button id="btnEdit">✏️ 편집</button>
  <button id="btnPrint">🖨️ 인쇄 · PDF 저장</button>
  <button id="btnExport">백업 저장</button>
  <button id="btnImport">백업 불러오기</button>
  <button id="btnReset">처음으로</button>
</div>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json" hidden>

<script>
/* 기본 내용 — TV 안내판(welcome_board.html)과 같은 저장 공간을 써서, 한쪽에서 넣은 사진·문구가 다른 쪽에도 나와요 */
const DEFAULT = {
  theme: "beige",
  store: {
    hello: "우리 매장 처음이지?\n반가워요 :)",
    name: "메종드 아이디헤어 반포자이점",
    title: "매장\n사용 설명서",
    open: "SINCE 2017",
    addr: "서울 서초구 잠원로 24\n반포자이플라자 1층",
    tel: "02-593-7111",
    owner: "보배 원장님",
    hours: "매일 10:00 ~ 20:00",
    off: "연중무휴 (디자이너별 OFF)",
    wifi: "ID  idhair\nPW  ID0123456789"

    ],
    badge: "신입 파트너\n필독",
    signals: "1번 · 2번 · M · T · H\n매장 신호 해독법",
    pull: "행복을 드리는 아이디헤어입니다",
    pullBy: "우리 매장 전화 첫마디",
    heads: {
      about: "2017년부터,\n반포자이플라자 1층",
      cast: "디자이너 7인을\n소개합니다",
      faces: "함께 성장할\n파트너들",
      day: "파트너의 첫날은\n이렇게 흘러가요",
      chal: "1주일 OJT\n완전 정복",
      dict: "알아두면 쉬운\n우리 매장 말",
      script: "고객님 마음 여는\n상황별 멘트",
      dd: "기본 에티켓,\n이것만은 꼭"
    },
    decks: {
      about: "출근 전에 꼭 알아 둘 우리 매장의 기본 정보예요. 와이파이는 오려서 지갑에 넣어 두세요.",
      cast: "오늘부터 같이 일할 선생님들이에요. 얼굴과 이름, 그리고 MBTI까지 미리 알아 두세요.",
      faces: "먼저 시작한 파트너 선배들과, 오늘 합류한 당신의 자리예요.",
      day: "출근부터 마감 준비까지, 첫날의 흐름을 시간 순서로 정리했어요.",
      chal: "하루에 하나씩. 미션을 끝낸 날은 오른쪽 위 네모에 체크하세요.",
      dict: "처음 들으면 헷갈리는 매장 신호와 말들, 여기서 한 번에 익혀요.",
      script: "",
      dd: "이것만 지켜도 첫인상이 달라져요."
    }
  },
  talk: {
    title: "고객님께 멘트하기",
    tip: "솔톤 목소리 · 메아리 멘트 · 선 멘트 후 행동!",
    parts: [
      { when:"입점 · 맞이할 때", lines:["환영합니다~\n예약 해주셨을까요?", "OOO 고객님, 오늘 OO 선생님께\nOO 예약 주셨죠~?", "소지품 보관 먼저 해드리겠습니다"] },
      { when:"음료 준비", lines:["기다리시는 동안\n음료 한 잔 준비해 드릴까요?", "OO 준비해 드리겠습니다~\n잠시만 기다려 주세요", "뜨거우니 조심하세요~"] },
      { when:"시술 준비", lines:["커트 준비해 드리겠습니다", "염색·클리닉 준비해 드리겠습니다", "약제 도포해 드리겠습니다\n살짝 차가우세요~"] },
      { when:"샴푸 · 시술 중", lines:["물 온도, 압 세기 괜찮으세요?", "열처리 진행할 건데 뜨겁거나\n불편하시면 바로 말씀해 주세요", "살짝 당기실 수 있는데\n아프시면 말씀해 주세요"] },
      { when:"퇴점 · 배웅할 때", lines:["고생하셨습니다~\n데스크로 안내해 드리겠습니다", "혹시 차량 가져오셨을까요?", "감사합니다. 조심히 들어가세요\n다음에 또 뵙겠습니다."] },
      { when:"전화 응대", lines:["행복을 드리는 아이디헤어입니다\n무엇을 도와드릴까요?", "원하시는 날짜와 시간대가\n어떻게 되실까요?", "O월 O일 O시 OO 선생님께\nOO 예약해 드리겠습니다"] }
    ]
  }
};

const KEY = "salon-welcome-board-v3";
let data = fillMbti(load());
let editing = false;

function load(){
  let d = structuredClone(DEFAULT);
  try { const s = localStorage.getItem(KEY); if (s) d = Object.assign(d, JSON.parse(s)); } catch(e){}
  return d;
}
function fillMbti(d){
  (d.designers || []).forEach(x => {
    if (!x.mbti || x.mbti === "MBTI"){ const k = DEFAULT.designers.find(y => y.name === x.name); if (k) x.mbti = k.mbti; }
  });
  return d;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ alert("저장 공간이 부족해요. 사진 수를 줄이거나 [백업 저장]을 해 두세요."); }
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const ed = (path, val, cls="", tag="div") => `<${tag} class="${cls}" data-path="${path}">${esc(val)}</${tag}>`;
function getP(path){ return path.split(".").reduce((o,k)=>o?.[k], data); }
function setP(path, v){ const ks = path.split("."); const last = ks.pop(); ks.reduce((o,k)=>o[k], data)[last] = v; }

const SILHOUETTE = `<svg viewBox="0 0 100 120"><circle cx="50" cy="40" r="24" fill="currentColor"/><path d="M8 120c4-30 22-44 42-44s38 14 42 44z" fill="currentColor"/></svg>`;

function photo(path, cls=""){
  const src = getP(path);
  return src ? `<div class="ph ${cls}" data-photo="${path}" style="background-image:url('${src}')"></div>`
             : `<div class="ph empty" data-photo="${path}">${SILHOUETTE}</div>`;
}
const tools = (key, i) => `<button class="mv" data-mv="${key}.${i}" title="앞으로">◀</button><button class="del" data-del="${key}.${i}">×</button>`;
const mbtiCode = v => ((v || "").toUpperCase().match(/[EI][SN][TF][JP]/) || [""])[0];

let PNO = 1;
function page(n, sec, inner, cls="", extra=""){
  const mg = data.magazine; n = ++PNO;
  return `<section class="page ${cls}">${extra}
    <div class="run"><span class="m">MAISON<small>de idHAIR</small></span><span class="sec">${sec}</span></div>
    <div class="art">${inner}</div>
    <div class="folio"><span>MAISON · ${esc(mg.issue)}</span><b>P. ${String(n).padStart(2,"0")}</b></div>
  </section>`;
}
const head = (k, path) => `<div class="kicker">${k}</div>${ed(`magazine.heads.${path}`, data.magazine.heads[path], "hl", "h2")}${ed(`magazine.decks.${path}`, data.magazine.decks[path], "deck")}`;


function profilePage(i){
  const d = data.designers[i], pr = d.profile, base = `designers.${i}.profile`;
  const qa = (path, q, a, mark) => `<div class="qa"><div class="q">${mark ? `<i>${mark}</i>` : "Q."}${ed(path + ".0", q, "", "span")}</div>${ed(path + ".1", a, "a")}</div>`;
  return page(0, `THE CAST · ${esc(pr.no || String(i+1).padStart(2,"0"))}`, `
    <div class="name">
      ${ed(`designers.${i}.name`, d.name, "pnm")}
      <div class="meta"><span class="kk">INTERVIEW</span>${ed(`designers.${i}.role`, d.role, "rl", "span")}${ed(`designers.${i}.mbti`, d.mbti, "mb", "span")}</div>
    </div>
    <div class="iv">
      <div class="col"><h3>HOW TO WORK WITH ME</h3>${pr.work.map((w,j)=>qa(`${base}.work.${j}`, w[0], w[1], j % 2 ? "✕" : "○")).join("")}</div>
      <div class="col"><h3>ABOUT ME</h3>${pr.about.map((a,j)=>qa(`${base}.about.${j}`, a[0], a[1], "")).join("")}</div>
    </div>`, "prof", `
    ${photo(`${base}.photo`, "hero")}
    <div class="no"><small>THE CAST</small>${esc(pr.no || String(i+1).padStart(2,"0"))}</div>
    <div class="quote">${ed(`${base}.oneQ`, pr.oneQ, "label")}${ed(`${base}.oneA`, pr.oneA.replace(/\s+/g, "\n"), "a")}</div>`);
}

function render(){
  PNO = 1;
  const s = data.store, mg = data.magazine, P = [];
  const branch = s.name.replace(/^.*아이디헤어\s*/, "") || s.name;

  /* 1. 표지 */
  P.push(`<section class="page cover">
    <div class="top"><span>${esc(mg.issue)}</span><span>${esc(s.open)} · ${esc(branch)}</span></div>
    <div class="mast" aria-label="Maison de idHAIR">MAISON</div>
    <div class="sub">de idHAIR</div>
    <div class="lines">
      <div class="cs"><div class="kicker">${esc(mg.coverKicker)}</div>${ed("magazine.coverHeadline", mg.coverHeadline, "hl")}</div>
      <div>${mg.coverLines.map((l,i)=>`<div class="cl">${ed(`magazine.coverLines.${i}.num`, l.num, "n", "span")}${ed(`magazine.coverLines.${i}.text`, l.text, "t", "span")}</div>`).join("")}</div>
    </div>
    <div class="cast">${data.designers.map((d,i)=>`
      <div class="s">${photo(`designers.${i}.photo`)}<div class="tag"><b>${esc(d.name)}</b><span>${esc(d.role)}</span></div></div>`).join("")}
    </div>
    ${ed("magazine.badge", mg.badge, "badge")}
    <div class="bottom">${ed("store.hello", s.hello, "hello")}${ed("magazine.signals", mg.signals, "sig")}</div>
  </section>`);

  /* 2. ABOUT */
  P.push(page(2, "ABOUT", `
    ${head("ABOUT · 반포자이점", "about")}
    <div class="about">
      <div><div class="year">${esc((s.open.match(/\d{4}/) || [s.open])[0])}</div><div class="yc">${esc(branch)}이 문을 연 해</div></div>
      <div class="facts">
        ${[["주소","addr"],["매장 번호","tel"],["대표","owner"],["영업시간","hours"],["휴무","off"]]
          .map(([k,f])=>`<div class="row"><span class="label">${k}</span>${ed("store."+f, s[f], "v")}</div>`).join("")}
      </div>
    </div>
    <div class="pull"><q>${esc(mg.pull)}</q><div class="label by">${esc(mg.pullBy)}</div></div>
    <div class="coupon"><div><div class="label">Cut out & keep · Wi-Fi</div>${ed("store.wifi", s.wifi, "v")}</div><div class="k">직원용\n와이파이</div></div>`));

  /* 3. THE CAST */
  const [lead, ...crew] = data.designers;
  const codes = data.designers.map(d => mbtiCode(d.mbti)).filter(Boolean);
  const cnt = (pos, ch) => codes.filter(c => c[pos] === ch).length;
  const pairs = [["E","I",0],["S","N",1],["T","F",2],["J","P",3]];
  P.push(page(3, "THE CAST", `
    ${head("THE CAST · MBTI 대공개", "cast")}
    ${lead ? `<div class="leadrow">
      ${photo("designers.0.photo")}
      <div>
        <div class="label">Cover star · 원장</div>
        ${ed("designers.0.name", lead.name, "nm")}
        ${ed("designers.0.role", lead.role, "rl")}
        ${ed("designers.0.mbti", lead.mbti, "big")}
        <div class="stat">${pairs.map(([a,b,p])=>`<div><b>${cnt(p,a)} : ${cnt(p,b)}</b><span>${a} : ${b}</span></div>`).join("")}</div>
      </div>${tools("designers",0)}
    </div>` : ""}
    <div class="castgrid">${crew.map((d,k)=>{ const i = k+1; return `
      <div class="cc">
        ${photo(`designers.${i}.photo`)}
        ${ed(`designers.${i}.mbti`, d.mbti, "mb" + ((d.mbti||"").length > 9 ? " long" : ""))}
        <div>${ed(`designers.${i}.name`, d.name, "nm", "span")}${ed(`designers.${i}.role`, d.role, "rl", "span")}</div>
        ${tools("designers",i)}
      </div>`; }).join("")}
    </div>
    <button class="add" data-add="designers">+ 디자이너 추가</button>`));

  data.designers.forEach((d,i) => { if (d.profile) P.push(profilePage(i)); });

  /* 4. NEW FACES */
  P.push(page(4, "NEW FACES", `
    ${head("NEW FACES · 파트너", "faces")}
    <div class="polas">${data.partners.map((p,i)=>`
      <div class="pola">${photo(`partners.${i}.photo`)}${ed(`partners.${i}.name`, p.name, "nm")}${ed(`partners.${i}.note`, p.note, "nt")}${tools("partners",i)}</div>`).join("")}
    </div>
    <button class="add" data-add="partners">+ 파트너 추가</button>`));

  /* 5. A DAY IN THE SALON */
  const f = data.firstday;
  P.push(page(5, "A DAY IN THE SALON", `
    ${head("A DAY IN THE SALON", "day")}
    <div class="day">
      <div class="tl">${f.flow.map((t,i)=>{ const parts = t.split(/\s{2,}/), lab = parts.length > 1 ? parts[0] : "", desc = parts.length > 1 ? parts.slice(1).join(" ") : t; return `
        <div class="f"><div class="t${lab.length > 6 ? " sm" : ""}">${esc(lab)}</div><div class="d show">${esc(desc)}</div>${ed(`firstday.flow.${i}`, t, "d full")}</div>`; }).join("")}
      </div>
      <aside class="side">
        <div><div class="label">Check-in</div><div class="h">출근</div>${ed("firstday.time", f.time, "v")}</div>
        <div><div class="label">Dress code</div><div class="h">복장</div>${ed("firstday.dress", f.dress, "v")}</div>
        <div><div class="label">In my bag</div><div class="h">준비물</div>${ed("firstday.bring", f.bring, "v")}</div>
      </aside>
    </div>`));

  /* 6. CHALLENGE */
  P.push(page(6, "CHALLENGE", `
    ${head("7-DAY CHALLENGE · OJT", "chal")}
    ${ed("todoNote", data.todoNote, "lead-in")}
    <div class="chal">${data.todo.map((t,i)=>`
      <div class="ch"><div class="dn"><small>DAY</small>${i+1}</div>${ed(`todo.${i}`, t, "what")}<span class="done" aria-hidden="true"></span>${tools("todo",i)}</div>`).join("")}
    </div>`));

  /* 7. DICTIONARY */
  const g = data.glossary;
  P.push(page(7, "SALON DICTIONARY", `
    ${head("SALON DICTIONARY", "dict")}
    <div class="label">매장 신호</div>
    <div class="keys">${g.signals.map((x,i)=>`<div>${ed(`glossary.signals.${i}.0`, x[0], "", "b")}${ed(`glossary.signals.${i}.1`, x[1], "", "span")}</div>`).join("")}</div>
    ${ed("glossary.signalNote", g.signalNote, "keynote")}
    <div class="dict">${g.terms.map((x,i)=>`<div>${ed(`glossary.terms.${i}.0`, x[0], "", "b")}${ed(`glossary.terms.${i}.1`, x[1], "", "span")}</div>`).join("")}</div>`));

  /* 8. SCRIPT BOOK */
  const tk = data.talk, total = tk.parts.reduce((a,p)=>a + p.lines.length, 0);
  P.push(page(8, "SCRIPT BOOK", `
    <div class="kicker">SCRIPT BOOK · 멘트 ${total}</div>
    ${ed("magazine.heads.script", mg.heads.script, "hl", "h2")}
    ${ed("talk.parts.0.lines.0", tk.parts[0].lines[0], "hero-q")}
    <div class="scripts">${tk.parts.map((p,i)=>`
      <div class="sc">${ed(`talk.parts.${i}.when`, p.when, "label")}${p.lines.map((l,j)=>(i===0&&j===0) ? "" : ed(`talk.parts.${i}.lines.${j}`, l, "q")).join("")}</div>`).join("")}
    </div>
    <div class="tipline"><span class="label">Tip</span>${ed("talk.tip", tk.tip)}</div>`));

  /* 9. DO & DON'T */
  const rules = data.etiquette.map((t,i)=>({ t, i, dont: /\sX\)?$|X$/.test(t.trim()) }));
  const li = r => `<li>${ed(`etiquette.${r.i}`, r.t)}<button class="del" data-del="etiquette.${r.i}">×</button></li>`;
  P.push(page(9, "DO & DON'T", `
    ${head("DO & DON'T", "dd")}
    <div class="dd">
      <div class="col"><div class="big">DO</div><div class="mk">이렇게 해요</div><ul>${rules.filter(r=>!r.dont).map(li).join("")}</ul></div>
      <div class="col"><div class="big">DON'T</div><div class="mk">이건 안 돼요</div><ul>${rules.filter(r=>r.dont).map(li).join("")}</ul></div>
    </div>
    <button class="add" data-add="etiquette">+ 줄 추가</button>`));

  document.getElementById("pages").innerHTML = P.join("");
  applyEdit();
}

function applyEdit(){
  document.body.classList.toggle("edit-on", editing);
  const root = document.getElementById("pages");
  root.classList.toggle("editing", editing);
  root.querySelectorAll("[data-path]").forEach(el => el.contentEditable = editing ? "plaintext-only" : "false");
  const b = document.getElementById("btnEdit");
  b.textContent = editing ? "✅ 편집 끝" : "✏️ 편집"; b.classList.toggle("on", editing);
}

const root = document.getElementById("pages");
root.addEventListener("input", e => {
  const el = e.target.closest("[data-path]"); if (!el) return;
  setP(el.dataset.path, el.innerText.replace(/\n+$/,"")); save();
  if (el.dataset.path === "store.name") document.querySelectorAll("[data-store-name]").forEach(f => f.textContent = data.store.name + " · 매장 사용 설명서");
});

let photoTarget = null;
root.addEventListener("click", e => {
  if (!editing) return;
  const ph = e.target.closest("[data-photo]"), del = e.target.closest("[data-del]"),
        add = e.target.closest("[data-add]"), mv = e.target.closest("[data-mv]");
  if (del){
    const [key, idx] = splitLast(del.dataset.del);
    if (!confirm("이 항목을 지울까요?")) return;
    getP(key).splice(+idx, 1); save(); render();
  } else if (add){
    const key = add.dataset.add;
    const blank = key==="designers" ? { photo:"", role:"디자이너", name:"이름", mbti:"MBTI", intro:"", tags:"", insta:"" }
                : key==="partners" ? { photo:"", name:"이름", note:"합류 날짜" } : "새 줄";
    getP(key).push(blank); save(); render();
  } else if (mv){
    const [key, idx] = splitLast(mv.dataset.mv); const a = getP(key), i = +idx;
    if (i>0){ [a[i-1], a[i]] = [a[i], a[i-1]]; save(); render(); }
  } else if (ph){
    photoTarget = ph.dataset.photo; document.getElementById("filePhoto").click();
  }
});
function splitLast(p){ const i = p.lastIndexOf("."); return [p.slice(0,i), p.slice(i+1)]; }

/* A4 인쇄용이라 사진은 조금 더 크게(긴 변 900px) 저장 */
document.getElementById("filePhoto").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !photoTarget) return;
  const img = new Image();
  img.onload = () => {
    const max = 900, r = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    setP(photoTarget, c.toDataURL("image/jpeg", 0.85)); save(); render(); URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
});

document.getElementById("btnEdit").onclick = () => { editing = !editing; applyEdit(); };
document.getElementById("btnPrint").onclick = () => { editing = false; applyEdit(); setTimeout(() => print(), 50); };
document.getElementById("btnReset").onclick = () => {
  if (confirm("사진과 고친 내용을 모두 지우고 처음 상태로 돌릴까요? (먼저 [백업 저장]을 권해요)")){
    data = structuredClone(DEFAULT); save(); render();
  }
};
document.getElementById("btnExport").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type:"application/json" }));
  a.download = "매장안내판_백업.json"; a.click();
};
document.getElementById("btnImport").onclick = () => document.getElementById("fileJson").click();
document.getElementById("fileJson").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { data = Object.assign(structuredClone(DEFAULT), JSON.parse(await f.text())); save(); render(); }
  catch(err){ alert("백업 파일을 읽지 못했어요."); }
});

render();
</script>
