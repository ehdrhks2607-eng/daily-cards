<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root { --studio:#E9E8E6; --paper:#fff; --ink:#1E1C1A; --graphite:#6F6B67; --mauve:#8B6C84; --mist:#EEE6EC; --hair:#CFCBC7;
  --display:"Anton","Black Han Sans",sans-serif; --title:"Black Han Sans","Pretendard",sans-serif; --body:"Pretendard",sans-serif; --mono:"IBM Plex Mono",monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#bdbab6; font-family:var(--body); color:var(--ink); }
.page { width:794px; height:1123px; margin:0 auto; background:var(--studio); position:relative; overflow:hidden; }
.run { position:absolute; left:46px; right:46px; top:0; display:flex; justify-content:space-between; align-items:baseline; padding:24px 0 10px; border-bottom:1.5px solid var(--ink); z-index:5; }
.run .m { font-family:var(--display); font-size:24px; } .run .m small { font-family:var(--mono); font-size:10px; color:var(--mauve); letter-spacing:2px; margin-left:6px; }
.run .sec { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:3px; color:var(--mauve); }

/* 모브 면 + 큰 이름 + 스티커 인물 */
.block { position:absolute; left:46px; right:46px; top:96px; height:590px; background:var(--mauve); overflow:visible; }
.block .kick { position:absolute; left:22px; top:18px; font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:3px; color:#fff; }
.block .no { position:absolute; right:22px; top:14px; font-family:var(--display); font-size:44px; color:#fff; line-height:1; }
.name { position:absolute; left:22px; top:58px; font-family:var(--title); font-size:250px; line-height:.98;
  color:#F4EEF2; white-space:pre-line; }
.sticker { position:absolute; right:-18px; bottom:-34px; height:590px; transform:rotate(-2deg);
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.28)); }
.snap { position:absolute; left:250px; bottom:-60px; width:168px; background:#fff; padding:9px 9px 34px; transform:rotate(-6deg);
  box-shadow:0 8px 18px rgba(0,0,0,.25); z-index:3; }
.snap img { display:block; width:100%; }
.snap span { position:absolute; left:0; right:0; bottom:9px; text-align:center; font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:2px; color:var(--graphite); }
.snap::before { content:""; position:absolute; left:50%; top:-10px; width:64px; height:20px; background:rgba(233,232,230,.85); transform:translateX(-50%) rotate(4deg); }
.badge { position:absolute; right:-16px; top:-26px; width:118px; height:118px; border-radius:50%; background:var(--ink); color:#fff; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transform:rotate(10deg); }
.badge b { font-family:var(--display); font-size:30px; line-height:1; } .badge span { font-family:var(--mono); font-size:10px; letter-spacing:2px; margin-top:4px; }

/* 아래 인터뷰 */
.lower { position:absolute; left:46px; right:46px; top:736px; bottom:58px; display:flex; flex-direction:column; }
.meta { display:flex; justify-content:space-between; align-items:baseline; border-bottom:3px solid var(--ink); padding-bottom:12px; }
.meta .who { font-family:var(--title); font-size:34px; } .meta .who small { font-family:var(--mono); font-size:12px; color:var(--mauve); letter-spacing:2px; margin-left:10px; }
.meta .join { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:2px; color:var(--graphite); }
.qa { flex:1; display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:0 22px; padding-top:16px; }
.qa div + div { border-left:1px solid var(--hair); padding-left:22px; }
.qa .q { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--mauve); letter-spacing:.5px; line-height:1.5; }
.qa .a { font-size:17px; font-weight:800; line-height:1.45; margin-top:8px; color:#b9b5b1; }
.qa .big .a { font-family:var(--title); font-weight:400; font-size:34px; line-height:1.15; color:#b9b5b1; }
.folio { position:absolute; left:46px; right:46px; bottom:0; display:flex; justify-content:space-between; padding:12px 0 22px; border-top:1px solid var(--hair);
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:2px; color:var(--graphite); }
</style></head><body>
<section class="page">
  <div class="run"><span class="m">MAISON<small>de idHAIR</small></span><span class="sec">NEW FACES</span></div>
  <div class="block">
    <div class="kick">NEW FACES · PARTNER</div>
    
    <div class="name">민
주</div>
    <img class="sticker" src="sticker.png" alt="민주">
    <div class="snap"><img src="snap.jpg" alt=""><span>UNFILTERED</span></div>
    <div class="badge"><b>NEW</b><span>FACE</span></div>
  </div>
  <div class="lower">
    <div class="meta"><span class="who">민주<small>PARTNER</small></span><span class="join">JOINED 20○○.○○</span></div>
    <div class="qa">
      <div class="big"><div class="q">나를 한마디로 표현하면?</div><div class="a">“답변이 오면<br>여기에 크게”</div></div>
      <div><div class="q">이건 나한테 물어봐!</div><div class="a">답변 대기 중</div>
           <div class="q" style="margin-top:22px">요즘 연습 중인 것 · 목표</div><div class="a">답변 대기 중</div></div>
      <div><div class="q">신입 파트너에게 한마디</div><div class="a">답변 대기 중</div></div>
    </div>
  </div>
  <div class="folio"><span>MAISON · VOL.01 · NEW PARTNER ISSUE</span><b>NEW FACES · 민주</b></div>
</section>
</body></html>
