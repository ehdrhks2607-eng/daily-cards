<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!--
  15-second vertical (1080x1920) motion-graphics reel template.
  Deterministic: nothing animates on its own. render_reel.py calls window.__setTime(t)
  for every frame and screenshots it, so the output is identical on every run.
  Data is injected at /*__REEL_DATA__*/ (see render_reel.py for the schema).
  Safe area: text stays inside x 110..900, y 260..1480 (Reels UI covers the edges).
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;background:var(--bg);color:var(--fg);
  word-break:keep-all;position:relative;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#dots{inset:0;background-image:radial-gradient(var(--mu) 2px,transparent 2.5px);background-size:60px 60px;opacity:.16}
#blob{width:620px;height:620px;border-radius:50%;background:var(--ac);left:0;top:0;will-change:transform}
#ring{width:760px;height:760px;border-radius:50%;border:6px solid var(--ac);left:0;top:0;opacity:0}
#wipe{inset:0;background:var(--ac);clip-path:circle(0px at 50% 50%)}
.head{top:236px;left:110px;right:110px;display:flex;justify-content:space-between;align-items:center;
  font-size:34px;font-weight:700;color:var(--mu);letter-spacing:-.5px}
.prog{display:flex;gap:10px}
.prog i{display:block;width:44px;height:8px;border-radius:4px;background:var(--mu);opacity:.25;overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0;background:var(--ac);transform-origin:left;transform:scaleX(0)}
.scene{left:110px;right:180px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding-bottom:180px}
.line{display:block;overflow:hidden;padding:.06em 0;white-space:nowrap}
.ch{display:inline-block;white-space:pre;will-change:transform}
.tag{align-self:flex-start;font-size:36px;font-weight:900;color:var(--bg);background:var(--fg);padding:10px 26px;border-radius:40px;margin-bottom:44px}
.hook{font-size:150px;font-weight:900;line-height:1.16;letter-spacing:-5px}
.hook .ac{color:var(--ac)}
.lbl{font-size:44px;font-weight:700;color:var(--mu);margin-bottom:18px}
.count{white-space:nowrap;font-size:190px;font-weight:900;letter-spacing:-8px;line-height:1;color:var(--ac);font-variant-numeric:tabular-nums}
.pain{margin-top:56px;font-size:56px;font-weight:700;line-height:1.45;letter-spacing:-1.5px}
.tips-h{font-size:44px;font-weight:700;color:var(--mu);margin-bottom:40px}
.tip{display:flex;align-items:center;gap:30px;background:var(--card);border-radius:28px;padding:34px 110px 34px 38px;margin-bottom:26px;
  box-shadow:0 10px 30px rgba(0,0,0,.06)}
.tip .n{flex:none;width:84px;height:84px;border-radius:50%;background:var(--ac);color:var(--bg);font-size:38px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.tip .t{min-width:0;flex:1;white-space:nowrap;overflow:hidden;font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1.25}
.tip .chk{position:absolute;right:38px;top:50%;width:52px;height:52px;margin-top:-26px}
.on-ac{color:var(--bg)}
.sm{font-size:46px;font-weight:700;opacity:.85;margin-bottom:26px}
.item{font-size:168px;font-weight:900;letter-spacing:-7px;line-height:1.08}
.isub{margin-top:44px;font-size:50px;font-weight:700;opacity:.9}
.underline{height:14px;background:var(--bg);border-radius:7px;margin-top:30px;transform-origin:left}
.cta{font-size:104px;font-weight:900;line-height:1.2;letter-spacing:-4px}
.pill{align-self:flex-start;margin-top:64px;display:flex;align-items:center;gap:18px;font-size:46px;font-weight:900;
  background:var(--ac);color:var(--bg);padding:26px 44px;border-radius:60px}
.pill svg{width:44px;height:44px}
.foot{left:110px;top:1500px;font-size:30px;color:var(--mu);font-weight:500}
</style></head><body>
<div id="dots" class="abs"></div>
<div id="ring" class="abs"></div>
<div id="blob" class="abs"></div>
<div id="wipe" class="abs"></div>

<div class="head abs"><span id="label"></span><span class="prog" id="prog"></span></div>

<div id="s1" class="scene abs"></div>
<div id="s2" class="scene abs"></div>
<div id="s3" class="scene abs"></div>
<div id="s4" class="scene abs"></div>
<div id="s5" class="scene abs"></div>
<div id="foot" class="foot abs"></div>

<script>
const DATA = /*__REEL_DATA__*/;
const THEMES = /*__THEMES__*/;
const th = THEMES[DATA.account];
const root = document.documentElement.style;
root.setProperty('--bg', th.bg); root.setProperty('--fg', th.fg);
root.setProperty('--ac', th.accent); root.setProperty('--mu', th.muted);
root.setProperty('--card', th.card || 'rgba(255,255,255,.72)');

// ---------- timeline (seconds) ----------
const T = {s1:[0,3.0], s2:[3.0,6.3], s3:[6.3,10.5], s4:[10.5,13.0], s5:[13.0,15.0]};
const D = DATA.duration || 15;

// ---------- easing helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const oExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const oCubic=x=>1-Math.pow(1-x,3);
const ioCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const oBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// split text into per-line, per-character spans. *word* = accent color
function kinetic(text, cls){
  return String(text||'').split('\n').map(line=>{
    let acc=false, out='';
    for(const c of Array.from(line)){
      if(c==='*'){acc=!acc;continue}
      out+=`<span class="ch${acc?' ac':''}">${esc(c)}</span>`;
    }
    return `<span class="line ${cls||''}">${out||'&nbsp;'}</span>`;
  }).join('');
}
function chars(el){return Array.from(el.querySelectorAll('.ch'))}
// characters rise from below their line mask, staggered
function animChars(list,t,start,stagger=.028,dur=.6){
  list.forEach((c,i)=>{const x=oExpo(p(t,start+i*stagger,start+i*stagger+dur));
    c.style.transform=`translateY(${(1-x)*110}%) rotate(${(1-x)*8}deg)`;c.style.opacity=x>0?1:0;});
}
function exitBlock(el,t,start,dur=.45){
  const x=ioCubic(p(t,start,start+dur));
  el.style.transform=`translateY(${-x*120}px)`;el.style.opacity=1-x;
}
const show=(el,t,[a,b])=>{el.style.visibility=(t>=a-0.001&&t<b+0.5)?'visible':'hidden'};

// ---------- build ----------
document.getElementById('label').textContent = '@'+(th.handle||th.label);
const prog=document.getElementById('prog');
prog.innerHTML=Object.keys(T).map(()=>'<i><b></b></i>').join('');
const bars=Array.from(prog.querySelectorAll('b'));

const s1=document.getElementById('s1');
s1.innerHTML=(DATA.series?`<div class="tag" id="tag">${esc(DATA.series)}</div>`:'')+`<div class="hook">${kinetic(DATA.hook)}</div>`;
const s1c=chars(s1); const tag=document.getElementById('tag');

const s2=document.getElementById('s2');
const C=DATA.count;
s2.innerHTML = C ? `<div class="lbl" id="clbl">${esc(C.label||'')}</div><div class="count" id="cnt">0</div><div class="pain">${kinetic(DATA.pain)}</div>`
                 : `<div class="pain" style="font-size:84px;letter-spacing:-3px">${kinetic(DATA.pain)}</div>`;
const s2c=chars(s2), cnt=document.getElementById('cnt'), clbl=document.getElementById('clbl');

const s3=document.getElementById('s3');
const CHECK=`<svg class="chk" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none" stroke="${th.accent}" stroke-width="4"/><path d="M14 27 l8 8 l16 -18" fill="none" stroke="${th.accent}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>`;
s3.innerHTML=`<div class="tips-h" id="tipsh">${esc(DATA.tips_title||'그래서 이렇게 해보는 중')}</div>`+
  (DATA.tips||[]).slice(0,3).map((x,i)=>`<div class="tip" style="position:relative"><div class="n">${i+1}</div><div class="t">${esc(x)}</div>${CHECK}</div>`).join('');
const tips=Array.from(s3.querySelectorAll('.tip')), tipsh=document.getElementById('tipsh');

const s4=document.getElementById('s4');
s4.innerHTML=`<div class="sm on-ac" id="ism">${esc(DATA.item_lead||'그래서 찾아본 것')}</div><div class="item on-ac">${kinetic(DATA.item)}</div>
  <div class="underline" id="iul"></div><div class="isub on-ac" id="isub">${esc(DATA.item_sub||'리뷰 많은 걸로 골라둠')}</div>`;
const s4c=chars(s4), ism=document.getElementById('ism'), iul=document.getElementById('iul'), isub=document.getElementById('isub');

const s5=document.getElementById('s5');
s5.innerHTML=`<div class="cta">${kinetic(DATA.cta)}</div>
  <div class="pill" id="pill">프로필 링크 <svg viewBox="0 0 44 44"><path d="M12 32 L32 12 M16 12 H32 V28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
const s5c=chars(s5), pill=document.getElementById('pill');
const foot=document.getElementById('foot'); foot.textContent=DATA.disclosure||'쿠팡 파트너스 활동으로 수수료를 받을 수 있어요';

const blob=document.getElementById('blob'), ring=document.getElementById('ring'), wipe=document.getElementById('wipe'), dots=document.getElementById('dots');
const fmt=n=>Math.round(n).toLocaleString('ko-KR');

// ---------- render(t) ----------
function render(t){
  // progress segments
  Object.values(T).forEach(([a,b],i)=>{bars[i].style.transform=`scaleX(${p(t,a,b)})`});
  dots.style.transform=`translate(${-(t*8)%60}px,${-(t*14)%60}px)`;

  // hero blob: travels between scenes (keyframes of x,y,scale,opacity)
  const K=[ // t, x, y, scale, opacity
    [0,   720, 1500, 0.0, .95],[0.7, 600, 1380, 1.0, .95],[2.8, 640, 1330, 1.05,.95],
    [3.3, 520,  420, 0.55,.18],[6.1, 560,  380, 0.62,.18],
    [6.6, -360, 900, 1.25,.12],[10.2,-330, 860, 1.3, .12],
    [10.6, 230, 650, 0.25,.95],[12.8, 230, 650, 0.25,.95],
    [13.3, 700, 1450,0.9, .95],[15,  690, 1430,0.95,.95]];
  let k=K.length-2; for(let i=0;i<K.length-1;i++){if(t<K[i+1][0]){k=i;break}}
  const A=K[k],B=K[k+1],x=ioCubic(p(t,A[0],B[0]));
  blob.style.transform=`translate(${lerp(A[1],B[1],x)}px,${lerp(A[2],B[2],x)}px) scale(${lerp(A[3],B[3],x)})`;
  blob.style.opacity=lerp(A[4],B[4],x);

  // ring pulse behind the counter
  const rx=p(t,3.3,4.4);
  ring.style.opacity=(t>3.2&&t<6.4)?(1-ioCubic(p(t,5.9,6.3)))*.38:0;
  ring.style.transform=`translate(${330}px,${400}px) scale(${.6+oExpo(rx)*.4}) rotate(${t*20}deg)`;
  ring.style.borderStyle='dashed';

  // full-screen accent wipe for the product scene
  const wIn=oCubic(p(t,10.35,10.95)), wOut=ioCubic(p(t,12.85,13.35));
  const r=wIn*(1-wOut)*2300;
  wipe.style.clipPath=`circle(${r}px at ${wOut>0?850:230}px ${wOut>0?1450:650}px)`;

  // label color flips on accent
  document.querySelector('.head').style.color = (wIn>.6&&wOut<.4)? th.bg : th.muted;

  // S1 hook
  show(s1,t,T.s1);
  if(tag){const x=oBack(p(t,.05,.5));tag.style.transform=`scale(${x})`;tag.style.opacity=x>0?1:0;}
  animChars(s1c,t,.2,.035,.7);
  exitBlock(s1,t,T.s1[1]-.35);

  // S2 count + pain
  show(s2,t,T.s2); s2.style.transform='';s2.style.opacity=1;
  if(C){
    const cx=oExpo(p(t,3.25,4.6));
    cnt.textContent=fmt(C.to*cx)+(C.suffix||'');
    const bump=p(t,4.5,4.9); cnt.style.transform=`scale(${1+Math.sin(bump*Math.PI)*.06})`;
    clbl.style.opacity=oCubic(p(t,3.1,3.5)); clbl.style.transform=`translateX(${(1-oExpo(p(t,3.1,3.6)))*-60}px)`;
    animChars(s2c,t,4.4,.022,.55);
  } else animChars(s2c,t,3.2,.03,.65);
  if(t>=T.s2[0]) exitBlock(s2,t,T.s2[1]-.35);

  // S3 tips
  show(s3,t,T.s3); s3.style.transform='';s3.style.opacity=1;
  tipsh.style.opacity=oCubic(p(t,6.4,6.8));
  tips.forEach((el,i)=>{const st=6.65+i*1.05, x=oExpo(p(t,st,st+.6));
    el.style.transform=`translateX(${(1-x)*700}px)`;el.style.opacity=x>0?1:0;
    const path=el.querySelector('path'); path.style.strokeDashoffset=1-oCubic(p(t,st+.45,st+.85));});
  if(t>=T.s3[0]) exitBlock(s3,t,T.s3[1]-.3,.35);

  // S4 product (on accent)
  show(s4,t,T.s4); s4.style.transform='';s4.style.opacity=1;
  ism.style.opacity=oCubic(p(t,10.7,11.0));
  animChars(s4c,t,10.8,.05,.6);
  iul.style.transform=`scaleX(${oExpo(p(t,11.3,11.9))*.5})`;
  isub.style.opacity=oCubic(p(t,11.6,12.0)); isub.style.transform=`translateY(${(1-oExpo(p(t,11.6,12.1)))*30}px)`;
  if(t>=T.s4[0]) exitBlock(s4,t,T.s4[1]-.25,.3);

  // S5 CTA
  show(s5,t,T.s5); s5.style.transform='';s5.style.opacity=1;
  animChars(s5c,t,13.25,.03,.6);
  const px=oBack(p(t,13.9,14.35)); pill.style.transform=`scale(${px*(1+Math.sin(Math.max(0,t-14.35)*7)*.025)})`; pill.style.opacity=px>0?1:0;
  foot.style.opacity=t>13.4?oCubic(p(t,13.4,13.8))*.9:0;
}
window.__setTime=t=>{render(Math.min(t,D-1e-3));return true};
window.__duration=D;
render(0);
// shrink any text block whose longest line overflows its column (safety net for long copy)
function fit(el,min){
  if(!el) return;
  const box=el.closest('.scene')||el.parentElement;
  const W=box.clientWidth;
  const over=()=>{const ls=el.querySelectorAll('.line');
    return ls.length?Array.from(ls).some(l=>l.scrollWidth>W+1):el.scrollWidth>el.clientWidth+1};
  let fs=parseFloat(getComputedStyle(el).fontSize), n=0;
  while(over()&&fs>min&&n++<40){fs*=0.95;el.style.fontSize=fs+'px';}
}
function fitAll(){
  [s1,s2,s3,s4,s5].forEach(s=>s.style.visibility='visible');
  if(C&&cnt) cnt.textContent=fmt(C.to)+(C.suffix||'');
  ['.hook','.count','.pain','.item','.cta'].forEach(q=>document.querySelectorAll(q).forEach(e=>fit(e,40)));
  document.querySelectorAll('.tip .t').forEach(e=>{let fs=58,n=0;while(e.scrollWidth>e.clientWidth+1&&fs>32&&n++<40){fs*=0.95;e.style.fontSize=fs+'px'}});
  render(0);
}
document.fonts.ready.then(()=>{fitAll();window.__ready=true});
</script>
</body></html>
